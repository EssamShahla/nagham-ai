services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nagham_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nagham_ai
    ports:
      - "5433:5432"
    volumes:
      - nagham_ai_postgres_data:/var/lib/postgresql/data

volumes:
  nagham_ai_postgres_data: